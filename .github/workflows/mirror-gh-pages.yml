name: Mirror to tinyd@gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Publish to jalonsogo/tinyd@gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.TINYD_PAGES_TOKEN }}
          external_repository: jalonsogo/tinyd
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: '.github,README.md,.screenshots'
          commit_message: "deploy: sync from tinyd-landing@${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
