# Docs: https://goreleaser.com
version: 2

project_name: tinyd

before:
  hooks:
    - go mod tidy

builds:
  - id: tinyd
    main: .
    binary: tinyd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Strip debug info to shrink the binary, then inject build metadata
      # via the package-level vars declared in main.go.
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: tinyd
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: true              # let you review notes before publishing
  prerelease: auto         # tags like v0.1.0-rc1 → prerelease
  name_template: "tinyd {{.Tag}}"
  header: |
    ## tinyd {{.Tag}}

    Download the binary for your platform below, extract, and run.

    ```sh
    # macOS / Linux
    tar -xzf tinyd_*_macOS_arm64.tar.gz
    ./tinyd

    # Windows
    # unzip the .zip and run tinyd.exe
    ```
  footer: |
    **Full Changelog**: https://github.com/jalonsogo/tinyd/compare/{{ .PreviousTag }}...{{ .Tag }}
