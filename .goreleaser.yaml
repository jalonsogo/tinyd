# Docs: https://goreleaser.com
version: 2

project_name: tinyd

before:
  hooks:
    - go mod tidy

builds:
  - id: tinyd
    main: .
    binary: tinyd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Strip debug info to shrink the binary, then inject build metadata
      # via the package-level vars declared in main.go.
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: tinyd
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  # release-please owns the GitHub Release (notes + tag); GoReleaser
  # only attaches the cross-platform binaries to it. `append` is also
  # safe for the manual-tag fallback path: if no release exists yet,
  # GoReleaser creates one and uploads assets.
  mode: append
  prerelease: auto         # tags like v0.1.0-rc1 → prerelease
